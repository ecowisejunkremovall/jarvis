[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  included_files = ["pricing.json"]

# ---- Performance: browser caching ----
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"


[[headers]]
  for = "/pricing.json"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400"

# Bin Solutions & Pet Waste paused (Nov 2026) - send visitors to the home page
[[redirects]]
  from = "/bins"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/bins/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/pet-waste"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/pet-waste/*"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/petwaste"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/petwaste/*"
  to = "/"
  status = 302
  force = true
